[project]
name = "hitomeguri-pipeline"
version = "0.1.0"
description = "ひとめぐり 資料 pipeline：採集、去重、LLM 補全、驗證、產生前端 bundle"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11",
  "httpx>=0.28",
  "anthropic>=1.0",
  # 中文維基簡介轉繁體（字元轉換，不改用語）
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff.lint.per-file-ignores]
# prompt 內的中文長句不斷行
"pipeline/verify_flights.py" = ["E501"]
"pipeline/tests/*" = ["E501"]
