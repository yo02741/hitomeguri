name: verify-flights

# 手動觸發：以 Claude（帶 web search）查證台灣直飛航線是否存在，結果附來源網址。
# 只做「查證與擷取」，不產生網路上沒有的內容（CLAUDE.md）。需要 repo secret ANTHROPIC_API_KEY。
# 結果推到 pipeline/verify-flights-<run> 分支，檢查後再合併。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-flights
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::請在 Settings → Secrets and variables → Actions 新增 ANTHROPIC_API_KEY"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: verify-flights
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python -m pipeline.cli verify-flights --report /tmp/report.md
      - name: 推到審核分支
        run: |
          branch="pipeline/verify-flights-${{ github.run_number }}"
          git config user.name "hitomeguri-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          if git diff --cached --quiet; then
            echo "沒有變更" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          verify-flights

          $(cat /tmp/report.md)
          MSG
          # 跑的期間工作分支若改過 workflow 檔，直接推會被拒（GitHub App 沒有 workflows 權限）：
          # 先併入最新的工作分支（資料衝突時保留這次的結果）
          git fetch -q --unshallow origin "$GITHUB_REF_NAME"
          git merge -q --no-edit -X ours "origin/$GITHUB_REF_NAME"
          git push -q origin "$branch"
          echo "推到 \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
