name: seed-region

# 手動觸發：採集指定都道府縣的大點（Wikidata + OSM + 種子清單），
# 結果推到 pipeline/seed-<run> 分支，檢查後再合併（PLAN.md §5：產出 = 審核佇列）。

on:
  workflow_dispatch:
    inputs:
      prefectures:
        description: "都道府縣 slug，空白分隔（例：kyoto aichi）"
        required: true
        default: "kyoto"

permissions:
  contents: write

concurrency:
  group: seed-region
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: seed-region
        run: .venv/bin/python -m pipeline.cli seed-region ${{ inputs.prefectures }} --report /tmp/report.md
      - name: 推到審核分支
        run: |
          branch="pipeline/seed-${{ github.run_number }}"
          git config user.name "hitomeguri-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/spots
          if git diff --cached --quiet; then
            echo "沒有變更" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          seed-region: ${{ inputs.prefectures }}

          $(cat /tmp/report.md)
          MSG
          git push -q origin "$branch"
          echo "推到 \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
