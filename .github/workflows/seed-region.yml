name: seed-region

# 手動觸發：採集指定都道府縣的大點（Wikidata + OSM + 種子清單）。
# 每縣一個平行 job，最後彙整推到 pipeline/seed-<run> 分支，檢查後再合併（PLAN.md §5）。

on:
  workflow_dispatch:
    inputs:
      prefectures:
        description: "都道府縣 slug，空白分隔（例：kyoto aichi）"
        required: true
        default: "kyoto"
      command:
        description: "seed-region（大點，含維基簡介與念法）、seed-wiki（只更新維基簡介與念法）、seed-themes（主題小店）、seed-specialties（地區特色＋航線候選）"
        required: true
        default: seed-region
        type: choice
        options: [seed-region, seed-wiki, seed-themes, seed-specialties]

permissions:
  contents: write

concurrency:
  group: seed-region
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      prefs: ${{ steps.p.outputs.prefs }}
    steps:
      - id: p
        run: |
          echo "prefs=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' '${{ inputs.prefectures }}')" >> "$GITHUB_OUTPUT"

  seed:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pref: ${{ fromJSON(needs.plan.outputs.prefs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: ${{ inputs.command }} ${{ matrix.pref }}
        run: .venv/bin/python -m pipeline.cli ${{ inputs.command }} ${{ matrix.pref }} --report report-${{ matrix.pref }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.pref }}
          path: |
            data/spots/${{ matrix.pref }}.json
            data/specialties/${{ matrix.pref }}.json
            data/flights/taiwan_direct.json
            report-${{ matrix.pref }}.md
          if-no-files-found: ignore

  collect:
    needs: seed
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/seed
      - name: 推到審核分支
        run: |
          mkdir -p data/spots
          : > /tmp/report.md
          for dir in /tmp/seed/seed-*; do
            [ -d "$dir" ] || continue
            if [ -d "$dir/data" ]; then cp -r "$dir/data/." data/; fi
            cat "$dir"/report-*.md >> /tmp/report.md
          done
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          branch="pipeline/${{ inputs.command }}-${{ github.run_number }}"
          git config user.name "hitomeguri-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/spots data/specialties data/flights 2>/dev/null || git add data
          if git diff --cached --quiet; then
            echo "沒有變更" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          ${{ inputs.command }}: ${{ inputs.prefectures }}

          $(cat /tmp/report.md)
          MSG
          git push -q origin "$branch"
          echo "推到 \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
