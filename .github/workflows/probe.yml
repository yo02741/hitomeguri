name: probe

# 手動觸發：取回網址內容印在 job log（寫爬蟲前確認 robots.txt、使用條款與網頁結構）。
# 沙箱連不到的網站用這個看。只讀取，不寫任何資料。

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "網址，空白分隔"
        required: true
      max_bytes:
        description: "每個網址最多印出幾個位元組"
        required: true
        default: "20000"
      pattern:
        description: "有填時只印出符合這個 grep -oE 樣式的片段"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: fetch
        env:
          URLS: ${{ inputs.urls }}
          MAX: ${{ inputs.max_bytes }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          for u in $URLS; do
            echo "===== $u"
            curl -sS -L -A "hitomeguri-pipeline/0.1 (+https://github.com/yo02741/hitomeguri)" -o /tmp/body -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$u" || true
            # Shift_JIS 的網頁與 CSV（氣象廳等）轉成 UTF-8 再印
            if ! iconv -f UTF-8 -t UTF-8 /tmp/body >/dev/null 2>&1; then iconv -f CP932 -t UTF-8 /tmp/body > /tmp/body8 2>/dev/null && mv /tmp/body8 /tmp/body; fi
            if [ -n "$PATTERN" ]; then grep -oE "$PATTERN" /tmp/body | head -200; else head -c "$MAX" /tmp/body; fi
            echo
            sleep 2
          done
