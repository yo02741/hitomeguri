name: CI

on:
  push:
    branches-ignore: ["pipeline/**"]
  pull_request:

jobs:
  web:
    name: 前端 typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_USE_EMULATORS: "0"

  pipeline:
    name: pipeline lint + test + 資料檢查 + regions.css 一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check pipeline
      - run: .venv/bin/pytest -q
      - name: 資料檢查（格式、schema、來源、禁用詞、bundle）
        run: .venv/bin/python -m pipeline.cli validate-data
      - name: regions.css 必須由 regions.json 產生
        run: |
          .venv/bin/python -m pipeline.cli build-region-css
          git diff --exit-code -- web/src/styles/regions.css
