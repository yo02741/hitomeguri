name: GitHub Pages

# 預設分支有變更時把前端靜態站部署到 GitHub Pages（https://yo02741.github.io/hitomeguri/）。
# Firebase Web 設定放在 repo 的 Actions variables（Settings → Secrets and variables → Actions → Variables）：
#   VITE_FIREBASE_API_KEY、VITE_FIREBASE_AUTH_DOMAIN、VITE_FIREBASE_PROJECT_ID、VITE_FIREBASE_APP_ID
# 未設定時站台仍可瀏覽地圖，登入按鈕停用。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 依分支分組：其他分支的推送（build 會跳過）不會取消 main 正在跑的部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 產生景點 bundle
        run: |
          uv venv && uv pip install -e .
          .venv/bin/python -m pipeline.cli build-bundles
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_USE_EMULATORS: "0"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - name: SPA fallback 與 .nojekyll
        run: |
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
