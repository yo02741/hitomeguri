name: seed-pack

# 手動觸發：採集全國一次抓完的資料（擴充包：寶可夢、城、老舖、角色商店；深度探索：地區特色、祭典、季節；鐵路路線；
# 收集卡的季節照片 seed-season-photos），
# 結果推到 pipeline/<command>-<run> 分支，檢查後再合併。全國一個 job 依序抓（同一網站，每秒最多一次請求）。

on:
  workflow_dispatch:
    inputs:
      command:
        description: "採集項目"
        required: true
        default: seed-pokefuta
        type: choice
        options: [seed-pokefuta, seed-pokecen, seed-castles, seed-shinise, seed-chara, seed-specialties, seed-festivals, seed-seasons, seed-rail, seed-official, translate-summaries, prune-spots, seed-season-photos, photo-stats, seed-photos, photo-review, photo-review-rest, photo-review-sharp, photo-check, ukiyoe-stats]
      prefectures:
        description: "都道府縣 slug，空白分隔；空白表示全部（seed-pokecen 不用）。translate-summaries：填數字表示只翻前 N 筆"
        required: false
        default: ""

permissions:
  contents: write

# 同一個指令、同一批縣一次只跑一個（GitHub 每個 group 只保留一個等待中的 run，不同指令分開才不會互相取消）。
# 不同批的縣可以同時跑（例如季節照片分東西兩批），各自推到自己的分支。
concurrency:
  group: seed-pack-${{ inputs.command }}-${{ inputs.prefectures }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: ${{ inputs.command }}
        env:
          PREFS: ${{ inputs.prefectures }}
          # 只有 translate-summaries 用得到（Claude API 翻譯英文簡介）
          ANTHROPIC_API_KEY: ${{ inputs.command == 'translate-summaries' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          case "${{ inputs.command }}" in
            seed-pokecen|seed-seasons|seed-castles|seed-shinise|seed-chara) args="" ;;
            translate-summaries)
              if [ -z "$ANTHROPIC_API_KEY" ]; then
                echo "::error::請在 Settings → Secrets and variables → Actions 新增 ANTHROPIC_API_KEY"
                exit 1
              fi
              args="${PREFS:+--limit $PREFS}" ;;
            prune-spots) args="$PREFS --wikidata" ;;  # 重新查 Wikidata 類型，排除非景點
            seed-season-photos) args="$PREFS --refresh" ;;  # 選圖規則改了就全部重選
            *) args="$PREFS" ;;
          esac
          cmd="${{ inputs.command }}"
          # photo-review-rest：非精選景點的照片審核圖
          if [ "$cmd" = photo-review-rest ]; then cmd=photo-review; args="$PREFS --rest"; fi
          if [ "$cmd" = photo-review-sharp ]; then cmd=photo-review; args="$PREFS --sharp"; fi
          .venv/bin/python -m pipeline.cli $cmd $args --report /tmp/report.md
      - name: 推到審核分支
        run: |
          branch="pipeline/${{ inputs.command }}-${{ github.run_number }}"
          git config user.name "hitomeguri-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY" || true
          git checkout -b "$branch"
          for d in data/packs data/specialties data/festivals data/rail data/seed/official data/translations data/flights data/spots data/seasons.json reports; do if [ -e "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then
            echo "沒有變更" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          ${{ inputs.command }}

          $(cat /tmp/report.md)
          MSG
          # 跑的期間工作分支若改過 workflow 檔，直接推會被拒（GitHub App 沒有 workflows 權限）：
          # 先併入最新的工作分支（資料衝突時保留這次的結果）
          git fetch -q --unshallow origin "$GITHUB_REF_NAME"
          git merge -q --no-edit -X ours "origin/$GITHUB_REF_NAME"
          git push -q origin "$branch"
          echo "推到 \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
