name: seed-pack

# 手動觸發：採集擴充包（目前只有寶可夢人孔蓋 ポケふた），結果推到 pipeline/<command>-<run> 分支，檢查後再合併。
# 全國一個 job 依序抓（同一網站，每秒最多一次請求）。

on:
  workflow_dispatch:
    inputs:
      command:
        description: "擴充包"
        required: true
        default: seed-pokefuta
        type: choice
        options: [seed-pokefuta, seed-pokecen]
      prefectures:
        description: "都道府縣 slug，空白分隔；空白表示全部（只有 seed-pokefuta 用）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: seed-pack
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: ${{ inputs.command }}
        env:
          PREFS: ${{ inputs.prefectures }}
        run: |
          if [ "${{ inputs.command }}" = seed-pokefuta ]; then args="$PREFS"; else args=""; fi
          .venv/bin/python -m pipeline.cli ${{ inputs.command }} $args --report /tmp/report.md
      - name: 推到審核分支
        run: |
          branch="pipeline/${{ inputs.command }}-${{ github.run_number }}"
          git config user.name "hitomeguri-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/packs
          if git diff --cached --quiet; then
            echo "沒有變更" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -F - <<MSG
          ${{ inputs.command }}

          $(cat /tmp/report.md)
          MSG
          git push -q origin "$branch"
          echo "推到 \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
