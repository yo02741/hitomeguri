<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="來一趟日本，才知道它有多大。" />
    <!-- 主題（DESIGN.md §13）：繪製前先設好，避免先閃一下現代主題（web/src/services/theme.ts） -->
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('hitomeguri:theme')
        if (/^(edo|meiji|taisho|showa|heisei)$/.test(t || '')) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字型不擋首次繪製：先 preload，載完才套用（開場畫面先用系統字） -->
    <link
      id="webfonts"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap"
      />
    </noscript>
    <!-- 開場畫面（DESIGN.md §7.0）：寫在 HTML 裡，JS 與字型下載前就會顯示。
         顏色與 47 縣的圓點由 vite.config.ts 在建置時從 data/regions.json 帶入。 -->
    <style>
      @property --hole {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: %REGION_PAPER%;
        color: %REGION_INK%;
        font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans TC", system-ui, sans-serif;
        /* 結束時從圓心開一個洞，洞越開越大露出底下的畫面 */
        --hole: 0px;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--hole), #000 calc(var(--hole) + 1px));
        mask-image: radial-gradient(circle at 50% 50%, transparent var(--hole), #000 calc(var(--hole) + 1px));
        transition: --hole 0.75s cubic-bezier(0.65, 0, 0.35, 1) 0.12s, opacity 0.4s ease 0.5s;
      }
      #splash.is-done {
        --hole: 150vmax;
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 184px;
        height: 184px;
      }
      #splash svg {
        position: absolute;
        inset: 0;
        overflow: visible;
        transform: rotate(-90deg);
      }
      #splash .ring-track {
        stroke: %REGION_LINE%;
      }
      /* 47 都道府縣：JIS 順從正上方順時針，進度走到哪一縣就亮成該縣的地區色 */
      #splash .dots {
        transform-origin: 92px 92px;
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease 0.15s;
      }
      #splash.is-done .dots {
        transform: scale(2.4);
        opacity: 0;
      }
      #splash .dot {
        --c: var(--c0);
        fill: %REGION_LINE%;
        transform-box: fill-box;
        transform-origin: center;
        transition: fill 0.2s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #splash .dot.on {
        fill: var(--c);
        transform: scale(1.3);
      }
      /* JS 接手前：前 14 縣（約三成）依序亮起 */
      #splash:not(.is-live) .dot:nth-child(-n + 14) {
        animation: splash-dot 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        animation-delay: calc(var(--i) * 110ms + 250ms);
      }
      @keyframes splash-dot {
        to {
          fill: var(--c);
          transform: scale(1.3);
        }
      }
      #splash .words {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1;
        animation: splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        transition: opacity 0.25s ease, transform 0.4s ease;
      }
      #splash.is-done .words {
        opacity: 0;
        transform: scale(0.94);
      }
      #splash .kana {
        font-size: 11px;
        letter-spacing: 4px;
        color: %REGION_SUB%;
        margin-bottom: 8px;
        padding-left: 4px;
      }
      #splash .kanji {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 4px;
        padding-left: 4px;
      }
      #splash .latin {
        font-family: "Barlow Semi Condensed", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 4px;
        color: %REGION_SUB%;
        margin-top: 10px;
        padding-left: 4px;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { -webkit-mask-image: none; mask-image: none; transition: opacity 0.3s ease; }
        #splash .dots, #splash .dot, #splash .words { transition: none; animation: none; }
        #splash.is-done .dots { transform: none; }
        #splash:not(.is-live) .dot:nth-child(-n + 14) { animation: none; }
        #splash .dot.on { transform: none; }
      }
    </style>
    <!-- 年代主題的開場畫面顏色（vite.config.ts 由 theme-colors.json 帶入） -->
    <style>%SPLASH_THEMES%</style>
    <title>ひとめぐり</title>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="ひとめぐり" aria-valuemin="0" aria-valuemax="100">
      <div class="mark">
        <svg viewBox="0 0 184 184" width="184" height="184" fill="none" aria-hidden="true">
          <circle class="ring-track" cx="92" cy="92" r="86" stroke-width="1" />
          <g class="dots">%SPLASH_DOTS%</g>
        </svg>
        <div class="words" lang="ja">
          <span class="kana">ひとめぐり</span>
          <span class="kanji">一巡り</span>
          <span class="latin">HITOMEGURI</span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
